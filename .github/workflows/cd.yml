name: Echo Chamber CD Pipeline

on:
  push:
    branches: [ "main", "master" ]

jobs:
  cd-release:
    name: Continuous Deployment (CD)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Build and Package Backend
      run: |
        mkdir -p build/backend
        cp -r backend/server.js backend/package.json build/backend/ 2>/dev/null || true
        cp -r backend/auth build/backend/auth 2>/dev/null || true
        cd build/backend
        npm install --omit=dev

    - name: Package Frontend (Game Source)
      run: |
        mkdir -p build/game
        cp -r src/ build/game/

    - name: Deploy Artifacts (GitHub Release Mock)
      uses: actions/upload-artifact@v4
      with:
        name: echo-chamber-production-build
        path: build/
        retention-days: 14
